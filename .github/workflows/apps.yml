# The apps' tests on a Mac runner, only when something under app/ or what the apps read by path
# (the fold fixture, the design tokens) changes: macOS minutes count ten times on a private
# repository, so server PRs do not pay for them. One job, both platforms in turn.
name: apps

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/fixtures/**'
      - 'docs/design-system/**'
      - 'Makefile'
      - 'scripts/ui-test.sh'
      - '.github/workflows/apps.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'docs/fixtures/**'
      - 'docs/design-system/**'
      - 'Makefile'
      - 'scripts/ui-test.sh'
      - '.github/workflows/apps.yml'

permissions:
  contents: read

concurrency:
  group: apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: xcodegen
        run: brew install xcodegen

      - name: xcode
        run: xcodebuild -version && xcrun simctl list devices available | grep -m1 'iPhone 17'

      - name: mac-test
        run: make mac-test

      - name: ios-test
        run: make ios-test

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: ui-test
        run: make ui-test

      # The quiet build hides the assertion text; say which line failed and keep the bundle.
      - name: failures
        if: failure()
        run: |
          for r in app/ios/build/DerivedData/Logs/Test/*.xcresult app/macos/build/DerivedData/Logs/Test/*.xcresult; do
            [ -d "$r" ] || continue
            echo "== $r"
            xcrun xcresulttool get test-results tests --path "$r" 2>/dev/null | python3 -c '
          import json, sys
          def walk(n):
              if isinstance(n, dict):
                  if n.get("result") == "Failed" and n.get("nodeType") == "Test Case":
                      print(n.get("name"))
                  if n.get("nodeType") == "Failure Message":
                      at = n.get("sourceLocation", {})
                      print("   ", at.get("filePath", "").split("/")[-1], at.get("lineNumber", ""), n.get("name"))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          walk(json.load(sys.stdin))'
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresults
          path: |
            app/ios/build/DerivedData/Logs/Test/*.xcresult
            app/macos/build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
