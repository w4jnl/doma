name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      # the schema arrives with phase 0 step 2; until then there is nothing to diff
      - name: sqlc generate is clean
        run: |
          if [ -f sqlc.yaml ]; then
            sqlc generate
            git diff --exit-code -- internal/db
          else
            echo "no sqlc.yaml yet"
          fi

      - name: tenancy gate
        run: scripts/check-tenancy.sh

      - name: egress gate
        run: scripts/check-egress.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: test
        run: go test -race ./...

      - name: goreleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
