{{define "content"}}
<form class="dm-card" method="post" action="/admin/login/code">
  <h1>Second step</h1>
  <p class="dm-muted">Type the code from your authenticator app.</p>
  {{if .Error}}<p class="dm-error">{{.Error}}</p>{{end}}
  <label class="dm-field"><span>Code</span><input class="dm-input dm-mono" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" required autofocus></label>
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <button class="dm-button" type="submit">Sign in</button>
</form>
{{end}}
