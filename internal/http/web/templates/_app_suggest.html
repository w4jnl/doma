{{range .Data.Matches}}<form method="post" action="{{$.Data.Base}}/add" hx-post="{{$.Data.Base}}/add" hx-target="#panel" hx-swap="outerHTML"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="text" value="{{.Name}}"><button class="dm-suggest-row" type="submit"><span class="dm-grow">{{.Name}}</span>{{if .Last}}<span class="dm-meta">{{if $.Data.Tasks}}{{t "last done %s" (ago .Last)}}{{else}}{{t "last bought %s" (ago .Last)}}{{end}}</span>{{end}}</button></form>{{end}}
