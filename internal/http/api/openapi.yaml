openapi: 3.1.0
info:
  title: doma
  version: "0.1"
  description: >-
    The family's household app. Apps talk to the sync endpoint and to this
    REST surface with a device-key signature; a guest uses a link; the admin
    signs in on the web pages. Errors are RFC 7807 problem documents; every
    response carries X-Request-Id. Anything outside the caller's households
    is a 404.
servers:
  - url: /
components:
  securitySchemes:
    deviceKey:
      type: apiKey
      in: header
      name: Doma-Signature
      description: >-
        Doma-Credential, Doma-Timestamp (Unix milliseconds) and Doma-Signature
        (base64) over "method\npath\ntimestamp\nsha256(body)" with the
        device's Ed25519 or P-256 key; five minutes of skew; no replays.
paths:
  /sync/v1:
    post:
      summary: The event exchange, every household of the device in one request
      description: >-
        Body {"households": [{"id", "since", "events": [outbox]}]}. Each
        household answers with accepted ids, rejected ids with reasons (the
        client drops them), the events after since in seq order (at most
        sync.max_events_per_response, loop while next advances), next, and
        a snapshot URL when since is too far behind to replay. A household
        the device's person is not in makes the whole request a 404.
      responses:
        "200": {description: the exchange}
        "422": {description: more than 2,000 events in one household}
        "429": {description: more than 120 requests a minute from this device}
  /sync/v1/snapshot/{household}/{seq}:
    get:
      summary: The tables at seq as gzip JSON, without other people's personal lists
      responses:
        "200": {description: gzip JSON}
  /photos/v1/{household}/{photo_id}:
    post:
      summary: The JPEG for an accepted photo.added; members, ten a minute per device
      description: >-
        The body is the picture, at most photos.max_bytes_per_upload. The
        server decodes it, keeps a JPEG with the metadata gone and at most
        1600 px on the long side, and a 320 px thumbnail; a spot keeps
        retention.photos_per_spot pictures, older ones go. Answers with
        id, spot_id, bytes kept, width and height.
      responses:
        "200": {description: stored}
        "400": {description: not a JPEG}
        "404": {description: no photo.added with this id in this household}
        "413": {description: over the upload cap or the household's photo quota, before and after the body}
        "429": {description: more than ten uploads a minute from this device}
    get:
      summary: The picture; a member's signed request, or a link signed by the server for an hour (exp and sig); cacheable 1 h
      responses:
        "200": {description: image/jpeg}
        "404": {description: pending, pruned or not this household's}
  /photos/v1/{household}/{photo_id}/thumb:
    get:
      summary: The 320 px thumbnail, as the picture
      responses:
        "200": {description: image/jpeg}
        "404": {description: pending, pruned or not this household's}
  /cards/v1/{household}/{card_id}/logo/{logo_id}:
    get:
      summary: The shop's logo the server fetched for a card, a PNG of at most 256 px; members, or a link the server signed
      responses:
        "200": {description: image/png}
        "404": {description: no such logo, another person's card, or not this household's}
  /i/{token}:
    post:
      summary: Accept an invite with a new or known device key
      security: []
      responses:
        "201": {description: person, credential and household}
        "404": {description: unknown, expired or revoked}
        "409": {description: already used}
        "429": {description: too many failed lookups from this address}
  /api/v1/openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200": {description: YAML}
  /api/v1/me:
    get:
      summary: The person, their devices and their households with roles, each household with its name, time zone and staleness
      responses:
        "200": {description: me}
  /api/v1/vouch:
    post:
      summary: The phone names the person at a browser that shows a web sign-in code; body {token}
      responses:
        "204": {description: vouched}
        "404": {description: unknown, expired or used code}
  /api/v1/credentials/{id}:
    delete:
      summary: Revoke a device, one's own or that of a member of a household the caller owns
      responses:
        "204": {description: revoked}
  /api/v1/devices/{credential}/apns:
    post:
      summary: Register or refresh the APNs token; body {token, sandbox} where sandbox says the token belongs to Apple's development gateway (a build from Xcode)
      responses:
        "204": {description: stored}
  /api/v1/devices/{credential}/notify:
    put:
      summary: What this device wants to hear; body {muted_lists: [list ids], clears: bool}; the device's own person only
      responses:
        "204": {description: kept}
  /api/v1/h/{household}:
    put:
      summary: Rename the household, set its time zone and staleness; owners
      responses:
        "200": {description: the household}
  /api/v1/h/{household}/members:
    get:
      summary: Members and owners with names and last seen
      responses:
        "200": {description: members}
  /api/v1/h/{household}/members/{person}:
    delete:
      summary: Remove a member; owners; the last owner cannot be removed
      responses:
        "204": {description: removed}
        "409": {description: the last owner}
  /api/v1/h/{household}/members/{person}/role:
    put:
      summary: Make a member an owner or an owner a member; owners
      responses:
        "204": {description: changed}
        "409": {description: the last owner}
  /api/v1/h/{household}/invites:
    get:
      summary: Pending invites; owners
      responses:
        "200": {description: invites}
    post:
      summary: Create a one-use invite; body {role} for a member or an owner (owners), or {device: true} for a device of the caller's own (any member; valid a day, adds a key to the same person)
      responses:
        "201": {description: the invite with its link}
  /api/v1/h/{household}/invites/{id}:
    delete:
      summary: Revoke a pending invite; owners
      responses:
        "204": {description: revoked}
  /api/v1/h/{household}/guests:
    get:
      summary: Guest links with their home, list and validity; owners
      responses:
        "200": {description: guests}
    post:
      summary: Make a guest link for one home and one shared list; owners; body {home_id, list_id, label, days}
      responses:
        "201": {description: the link, shown once}
  /api/v1/h/{household}/guests/{id}:
    delete:
      summary: End a guest link now; owners
      responses:
        "204": {description: ended}
  /api/v1/h/{household}/export:
    get:
      summary: A zip with household.json, events.ndjson, purchases.csv, lists/*.md, homes/*.md and photos/; members
      responses:
        "200": {description: zip}
