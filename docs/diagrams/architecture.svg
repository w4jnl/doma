<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 588" width="760" height="588"><rect width="760" height="588" fill="#F6F8F8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7E8D90"/></marker></defs><text x="24" y="28" font-size="15" font-weight="700" fill="#14181A" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Three clients reach one service layer; one fold writes the store</text><rect x="24" y="52" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="132" y="76" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">iPhone and Mac apps</text><text x="132" y="92" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">local store and outbox</text><text x="132" y="108" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">signed with the device key</text><path d="M132 124V156" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><rect x="272" y="52" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="380" y="76" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Guest browser</text><text x="380" y="92" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">one home and one list</text><text x="380" y="108" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">7-day link, any phone</text><path d="M380 124V156" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><rect x="520" y="52" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="628" y="76" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Admin browser</text><text x="628" y="92" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">households, quotas, backup</text><text x="628" y="108" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">password, optional TOTP</text><path d="M628 124V156" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><rect x="24" y="156" width="712" height="408" rx="12" fill="#E8F6F6" stroke="#7E8D90" stroke-width="1.25"/><text x="40" y="178" font-size="13" font-weight="700" fill="#14181A" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">doma server: one Go binary, one SQLite file</text><rect x="40" y="188" width="680" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="380" y="212" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Transports</text><text x="380" y="228" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">POST /sync/v1 for the apps · /api/v1 for invites, guests, members, export</text><text x="380" y="244" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">/g guest pages and /admin pages rendered with htmx · silent pushes out to APNs</text><path d="M380 260V284" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><rect x="40" y="284" width="680" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="380" y="308" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Service layer</text><text x="380" y="324" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">owns authorization (Scope), transactions and validation; the only caller of the fold and the store</text><text x="380" y="340" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">household, person, invite, guest, list, home, trip, photo and admin services</text><path d="M380 356V380" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><rect x="40" y="380" width="680" height="72" rx="8" fill="#0B7A7E" fill-opacity="0.12" stroke="#0B7A7E" stroke-width="2"/><text x="380" y="404" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Fold</text><text x="380" y="420" font-size="11.5" font-weight="400" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">applies each event kind to the tables with one rule set; pure functions, no I/O</text><text x="380" y="436" font-size="11.5" font-weight="400" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">the same rules and the same fixture in Go here and in Swift on every device</text><path d="M380 452V476" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><rect x="40" y="476" width="680" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="380" y="500" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Store</text><text x="380" y="516" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">SQLite in WAL mode through sqlc, one writer: events, snapshots, materialised tables</text><text x="380" y="532" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">photos as files on disk, one directory per household, quota enforced</text></svg>