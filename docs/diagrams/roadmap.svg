<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208"><rect width="760" height="208" fill="#F6F8F8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7E8D90"/></marker></defs><text x="24" y="28" font-size="15" font-weight="700" fill="#14181A" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Four phases, each gated by something the family can feel</text><rect x="24" y="60" width="166" height="72" rx="8" fill="#0B7A7E" fill-opacity="0.12" stroke="#0B7A7E" stroke-width="2"/><text x="107" y="84" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Phase 0</text><text x="107" y="100" font-size="11.5" font-weight="400" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">server, identity, sync</text><text x="107" y="116" font-size="11.5" font-weight="400" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">lists, Family, Mac</text><path d="M190 124l8 8l-8 8l-8 -8z" fill="#7E8D90"/><text x="190" y="158" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">ShopShop deleted</text><text x="190" y="174" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">after two weeks on doma</text><rect x="206" y="60" width="166" height="72" rx="8" fill="#E8F6F6" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="289" y="84" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Phase 1</text><text x="289" y="100" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">homes, flags, photos</text><text x="289" y="116" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">trips, guest links</text><path d="M372 124l8 8l-8 8l-8 -8z" fill="#7E8D90"/><text x="372" y="158" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">one trip between homes</text><text x="372" y="174" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">nothing double, nothing missing</text><rect x="388" y="60" width="166" height="72" rx="8" fill="#E8F6F6" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="471" y="84" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Phase 2</text><text x="471" y="100" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">App Store, 2nd family</text><text x="471" y="116" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">quotas, backup drill</text><path d="M554 124l8 8l-8 8l-8 -8z" fill="#7E8D90"/><text x="554" y="158" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">a second family joins</text><text x="554" y="174" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">from the store alone</text><rect x="570" y="60" width="166" height="72" rx="8" fill="#E8F6F6" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="653" y="84" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Phase 3</text><text x="653" y="100" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">passkeys, web client</text><text x="653" y="116" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">vision flags, tasks</text><text x="736" y="158" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="end" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">each item its own gate</text></svg>