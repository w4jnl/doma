<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332"><rect width="760" height="332" fill="#F6F8F8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7E8D90"/></marker></defs><text x="24" y="28" font-size="15" font-weight="700" fill="#14181A" text-anchor="start" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Three flags and a fade: stock is presence, never a count</text><rect x="24" y="100" width="200" height="72" rx="8" fill="#0B7A7E" fill-opacity="0.12" stroke="#0B7A7E" stroke-width="2"/><text x="124" y="124" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">have ●</text><text x="124" y="140" font-size="11.5" font-weight="400" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">it is there</text><text x="124" y="156" font-size="11.5" font-weight="400" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">tap, cleared list, arrival</text><rect x="280" y="100" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="380" y="124" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">low ◐</text><text x="380" y="140" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">last one open</text><text x="380" y="156" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">set by a tap</text><rect x="536" y="100" width="200" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7E8D90" stroke-width="1.25"/><text x="636" y="124" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">out ◆</text><text x="636" y="140" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">not there; goes on the list</text><text x="636" y="156" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">tap, or a trip moved it</text><path d="M224 136H280" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><path d="M480 136H536" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><path d="M636 100V76H124V100" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)"/><path d="M124 172V236" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)" marker-start="url(#a)"/><path d="M380 172V236" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)" marker-start="url(#a)"/><path d="M636 172V236" fill="none" stroke="#7E8D90" stroke-width="1.25" marker-end="url(#a)" marker-start="url(#a)"/><rect x="24" y="236" width="712" height="72" rx="8" fill="#E8F6F6" stroke="#7E8D90" stroke-width="1.25" stroke-dasharray="4 4"/><text x="380" y="260" font-size="13" font-weight="700" fill="#14181A" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">unknown ◌</text><text x="380" y="276" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">no flag, or a flag older than the household's staleness setting (default 60 days)</text><text x="380" y="292" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">computed when read, never stored; an unknown staple is what the home screen asks about</text><text x="380" y="68" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">bought and the list cleared · arrived with it on a trip</text><text x="252" y="208" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">no update for 60 days</text><text x="508" y="208" font-size="11.5" font-weight="400" fill="#5A686B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">Still there? sets it again</text></svg>