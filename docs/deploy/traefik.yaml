# Traefik dynamic configuration for doma: terminate TLS and forward
# everything. No auth middleware in front: doma authenticates every route
# itself, and invite links (/i/…) and guest links (/g/…) must open from a
# phone on mobile data. To put Authelia in front of the admin pages only,
# see authelia/traefik.yaml next to this file.
http:
  routers:
    doma:
      rule: "Host(`doma.example.com`)"
      entryPoints: [websecure]
      service: doma
      tls:
        certResolver: letsencrypt
  services:
    doma:
      loadBalancer:
        servers:
          - url: "http://doma:8080"
